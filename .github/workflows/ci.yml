# Build and test on every pull request and every push to main or a release tag.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace services/event-service run prisma:generate
      - run: npm --workspace services/event-service run build
      - run: npm --workspace services/attendee-service run build
      - run: npm --workspace frontend run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace services/event-service run prisma:generate
      - run: npm --workspace services/event-service test
      - run: npm --workspace services/attendee-service test
