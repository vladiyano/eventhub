# Build and test on every pull request and push; deploy main to staging; deploy release tags (vX.Y.Z) to production.
# The deploy jobs only print: nothing is really deployed. They name a GitHub environment, so GitHub records each
# deployment (staging or production) the way a real deploy would.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace services/event-service run prisma:generate
      - run: npm --workspace services/event-service run build
      - run: npm --workspace services/attendee-service run build
      - run: npm --workspace frontend run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace services/event-service run prisma:generate
      - run: npm --workspace services/event-service test
      - run: npm --workspace services/attendee-service test

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.eventhub.example.com
    steps:
      - run: echo "Deploying ${GITHUB_SHA::8} to staging"

  deploy-production:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://eventhub.example.com
    steps:
      - run: echo "Deploying ${GITHUB_REF_NAME} to production"
      - run: echo "Health check passed"
